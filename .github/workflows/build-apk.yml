name: Build Android APK (Life Online)

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - "v*"
  workflow_dispatch: # 支持在 GitHub 网页上点击 "Run workflow" 手动触发编译

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 配置 Java 21 运行环境 (Set up JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 配置 Gradle 执行权限 (Chmod Gradle Wrapper)
        run: chmod +x ./gradlew

      - name: 云端执行 Gradle 编译 (Assemble Debug APK)
        run: ./gradlew assembleDebug --no-daemon

      - name: 整理与命名编译产物 (Prepare Artifacts)
        run: |
          mkdir -p output/
          cp app/build/outputs/apk/debug/app-debug.apk output/LifeOnline-Debug.apk

      - name: 上传构建产物 (Upload APK to Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: LifeOnline-Debug-APK
          path: output/LifeOnline-Debug.apk
          retention-days: 30

      - name: 自动发布为 GitHub Release (仅在打 tag 时发布)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/LifeOnline-Debug.apk
          name: "人生 Online ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
